name: Build Android APK
on:
  push: {branches: [main]}
  release: {types: [published]}
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set app version from the latest release
        env: {GH_TOKEN: '${{ github.token }}', TAG: '${{ github.event.release.tag_name }}'}
        run: |
          VER="$TAG"
          [ -n "$VER" ] || VER=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          VER="${VER#v}"; VER="${VER#V}"
          [ -n "$VER" ] || VER=$(node -p "require('./package.json').version")
          echo "VER=$VER" >> "$GITHUB_ENV"
          grep -rl 'class="appver"' www | xargs -r sed -i -E "s#<span class=\"appver\">[^<]*</span>#<span class=\"appver\">$VER</span>#g"
          echo "App version: $VER"; grep -rho '<span class="appver">[^<]*</span>' www | head -1
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Use fixed signing key (updates install over old version)
        env: {KS: '${{ secrets.ANDROID_DEBUG_KEYSTORE }}'}
        run: |
          if [ -z "$KS" ]; then echo "::warning::ANDROID_DEBUG_KEYSTORE secret is missing - APK will use a temporary key"; exit 0; fi
          for d in "$HOME/.android" "${ANDROID_USER_HOME:-}" "${ANDROID_PREFS_ROOT:-}"; do
            [ -n "$d" ] || continue; mkdir -p "$d"; echo "$KS" | base64 -d > "$d/debug.keystore"
          done
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android | tail -2
      - run: npm install
      - run: npx cap add android
      - name: Set Android version (shown in phone settings)
        run: |
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" $G
          grep -E "versionCode|versionName" $G
      - name: Generate icons and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0b2a33' --splashBackgroundColor '#0b2a33'
        continue-on-error: true
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk rawd-azkar.apk
      - uses: actions/upload-artifact@v4
        with: {name: rawd-azkar-android-apk, path: rawd-azkar.apk}
      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with: {files: rawd-azkar.apk, tag_name: '${{ github.event.release.tag_name }}'}
