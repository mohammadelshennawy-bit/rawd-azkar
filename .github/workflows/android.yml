name: Build Android APK
on:
  push: {branches: [main]}
  release: {types: [published]}
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - name: Generate icons and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0b2a33' --splashBackgroundColor '#0b2a33'
        continue-on-error: true
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk rawd-azkar.apk
      - uses: actions/upload-artifact@v4
        with: {name: rawd-azkar-android-apk, path: rawd-azkar.apk}
      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with: {files: rawd-azkar.apk, tag_name: '${{ github.event.release.tag_name }}'}
